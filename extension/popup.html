<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #fdfdfd;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 6px;
      font-size: 13px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      background: #ffffff;
      text-align: left;
      color: #333;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    button:hover {
      background: #f5f5f5;
      border-color: #ccc;
    }
    /* Стиль для активного прокси */
    button.active {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
      font-weight: 600;
    }
    /* Единый нейтральный стиль для кнопки выключения */
    .off-btn {
      background: #fafafa;
      color: #666;
      font-weight: 500;
      justify-content: flex-start;
      gap: 8px;
    }
    .off-btn:hover {
      background: #f0f0f0;
      color: #333;
    }
    .status-dot {
      font-size: 10px;
    }
  </style>
</head>
<body>
  <h3>🔌 ProxyBridge</h3>
  <button class="off-btn" id="disableBtn"><span>⚪ Выключить (Direct)</span></button>
  <div id="proxyList"><small style="color:#666;">Загрузка из Compose...</small></div>

  <script src="popup.js"></script>
</body>
</html>
